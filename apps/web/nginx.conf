# UNVERIFIED (see apps/web/Dockerfile): nginx config for the built Vite SPA.
#
# - Serves the static build from /usr/share/nginx/html.
# - SPA fallback: unknown paths resolve to index.html so react-router's
#   client-side routes (e.g. /entities/:id) work on a hard refresh.
# - Proxies /api/* to the server service. The upstream hostname "server" is
#   the docker-compose service name (docker-compose.yml) and, deliberately,
#   also the k8s Service name (k8s/30-server.yaml) — same nginx.conf works
#   unmodified in both environments via cluster/compose DNS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
