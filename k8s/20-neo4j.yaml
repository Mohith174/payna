# Neo4j graph store (docs/SPEC.md §2). StatefulSet + volumeClaimTemplate so
# the data volume survives pod restarts and (if ever scaled) each replica
# gets its own volume — though this is single-instance community edition,
# no clustering.
#
# Same placeholder-secret caveat as k8s/10-postgres.yaml: replace
# NEO4J_PASSWORD before applying to a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: payna
type: Opaque
stringData:
  # The neo4j image takes a single "user/password" string, not separate
  # user/password env vars — NEO4J_URI etc. on the server side (k8s/30-server.yaml)
  # still reference user and password separately for the neo4j-driver client.
  NEO4J_AUTH: neo4j/CHANGE_ME
  NEO4J_PASSWORD: CHANGE_ME
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: payna
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_AUTH
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: payna
spec:
  clusterIP: None # headless, matches the StatefulSet
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
