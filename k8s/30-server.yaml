# @payna/server (apps/server/Dockerfile). Non-secret config in a ConfigMap,
# credentials in a Secret — LLM_API_KEY is never inlined; replace the
# placeholder before applying to a real cluster (or point envFrom at a
# Secret managed by your secret manager / External Secrets Operator).
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  namespace: payna
data:
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  DATABASE_URL: postgres://payna:payna@postgres:5432/payna # password below overrides the placeholder in this URL — see Secret
  LLM_BASE_URL: https://integrate.api.nvidia.com/v1
  LLM_MODEL: nvidia/nemotron-3-super-120b-a12b
  MOCK_EXTRACTION: "false"
  PORT: "4000"
---
apiVersion: v1
kind: Secret
metadata:
  name: server-secrets
  namespace: payna
type: Opaque
stringData:
  NEO4J_PASSWORD: CHANGE_ME # must match k8s/20-neo4j.yaml's NEO4J_AUTH password
  # Full DATABASE_URL with the real password embedded (Postgres has no
  # separate PGPASSWORD env in this app — src/db/postgres.ts takes one
  # connection string) — this key wins over the ConfigMap's DATABASE_URL
  # because it's applied second in envFrom below.
  DATABASE_URL: postgres://payna:CHANGE_ME@postgres:5432/payna
  LLM_API_KEY: "" # set via `kubectl create secret` / secret manager; empty + MOCK_EXTRACTION=true is fine for a demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: payna
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: payna/server:latest # build+push apps/server/Dockerfile under this tag
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: server-config
            - secretRef:
                name: server-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: payna
spec:
  selector:
    app: server
  ports:
    - port: 4000
      targetPort: 4000
